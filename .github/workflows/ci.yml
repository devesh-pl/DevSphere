name: DevSphere CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: devsphere_ci
          POSTGRES_DB: devsphere_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devsphere_ci -d devsphere_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_BUILD_DATABASE_URL: postgresql+psycopg://devsphere_ci@127.0.0.1:5432/devsphere_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest kubernetes sqlalchemy "psycopg[binary]" fastapi cryptography python-dotenv

      - name: Check Python syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          files = []
          for folder in ("services", "scripts", "tests"):
              root = Path(folder)
              if root.exists():
                  files.extend(root.rglob("*.py"))

          for file in files:
              py_compile.compile(str(file), doraise=True)

          print(f"PASS: {len(files)} Python files compiled")
          PY

      - name: Test deployment reconciliation
        run: |
          python -m pytest -q tests/unit/test_deployment_reconciler.py tests/unit/test_build_crud.py

  frontend-build:
    name: React production build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/developer-portal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/developer-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test frontend CRUD and session expiry
        run: npm test

      - name: Build frontend
        run: npm run build

  java-checks:
    name: Java 21 Spring Boot services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test Eureka, Project and Deployment services
        run: ./mvnw -B verify
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-results
          path: services/*/target/surefire-reports/
