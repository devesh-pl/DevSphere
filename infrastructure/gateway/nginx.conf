server {
    listen 8080;
    server_name _;

    server_tokens off;
    client_max_body_size 3m;

    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Resolve optional services at request time so the legacy gateway can start without Java.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $project_backend project-service-spring:8087;
    set $spring_backend deployment-service-spring:8088;
    set $build_backend host.docker.internal:8006;

    location = /api/projects {
        proxy_pass http://$project_backend/projects$is_args$args;
        proxy_set_header Authorization $http_authorization;
    }
    location = /api/projects/ {
        return 308 /api/projects$is_args$args;
    }
    location /api/projects/ {
        rewrite ^/api/projects/(.*)$ /projects/$1 break;
        proxy_pass http://$project_backend;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/deployment-spring/ {
        rewrite ^/api/deployment-spring/(.*)$ /$1 break;
        proxy_pass http://$spring_backend;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/build/ {
        rewrite ^/api/build/(.*)$ /$1 break;
        proxy_pass http://$build_backend;
        proxy_set_header Authorization $http_authorization;
    }

    location = /gateway/health {
        default_type application/json;
        return 200 '{"status":"ok","service":"api-gateway"}';
    }

    location /api/auth/ {
        proxy_pass http://auth-service:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/orchestrator/ {
        proxy_pass http://orchestrator-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/deployment/ {
        proxy_pass http://deployment-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
