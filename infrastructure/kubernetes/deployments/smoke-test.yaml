apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsphere-smoke
  namespace: devsphere-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devsphere-smoke
  template:
    metadata:
      labels:
        app: devsphere-smoke
    spec:
      containers:
        - name: web
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: devsphere-smoke
  namespace: devsphere-apps
spec:
  selector:
    app: devsphere-smoke
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP
