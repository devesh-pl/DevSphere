apiVersion: v1
kind: ServiceAccount
metadata:
  name: devsphere-deployment
  namespace: devsphere-apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devsphere-deployment-manager
  namespace: devsphere-apps
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch", "delete"]

  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devsphere-deployment-binding
  namespace: devsphere-apps
subjects:
  - kind: ServiceAccount
    name: devsphere-deployment
    namespace: devsphere-apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devsphere-deployment-manager
