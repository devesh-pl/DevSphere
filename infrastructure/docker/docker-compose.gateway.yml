services:
  api-gateway:
    image: nginx:stable-alpine
    container_name: devsphere-gateway
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ../gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - devsphere-internal

    mem_limit: 128m
    cpus: 0.25
