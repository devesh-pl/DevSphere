apiVersion: 1

datasources:
  - name: DevSphere Build Database
    uid: devsphere-build-db
    type: postgres
    access: proxy
    url: postgres:5432
    user: devsphere_grafana
    secureJsonData:
      password: $__env{BUILD_GRAFANA_PASSWORD}
    jsonData:
      database: build_db
      sslmode: disable
      postgresVersion: 1800
      timescaledb: false
      maxOpenConns: 3
      maxIdleConns: 1
      timeInterval: 1m
    editable: false
