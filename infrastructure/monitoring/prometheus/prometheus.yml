global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: devsphere-health
    metrics_path: /probe
    params:
      module: [http_2xx]

    static_configs:
      - targets:
          - http://auth-service:8000/health
        labels:
          service: auth

      - targets:
          - http://orchestrator-service:8000/health
        labels:
          service: orchestrator

      - targets:
          - http://deployment-service:8000/ready
        labels:
          service: deployment

      - targets:
          - http://api-gateway:8080/gateway/health
        labels:
          service: gateway

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: devsphere-api
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - deployment-service:8000
        labels:
          service: deployment

  - job_name: devsphere-spring
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [eureka-server:8761]
        labels: {service: eureka}
      - targets: [project-service-spring:8087]
        labels: {service: project-spring}
      - targets: [deployment-service-spring:8088]
        labels: {service: deployment-spring}
