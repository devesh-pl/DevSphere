server:
  port: ${PORT:8088}
spring:
  application:
    name: deployment-service
  datasource:
    url: ${DATABASE_JDBC_URL:jdbc:postgresql://localhost:5432/deployment_db}
    username: ${DATABASE_USER:deployment_service}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    default-schema: deployment_spring
    schemas: deployment_spring
    table: flyway_deployment_history
    baseline-on-migrate: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
eureka:
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
devsphere:
  auth-url: ${AUTH_SERVICE_URL:http://localhost:8001}
  orchestrator-url: ${ORCHESTRATOR_URL:http://localhost:8004}
  deployment-writes: ${DEPLOYMENT_WRITES:false}
  kubeconfig: ${KUBECONFIG:}
  reconcile-ms: 15000
